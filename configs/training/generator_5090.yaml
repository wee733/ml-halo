experiment_name: halo_sit_5090
seed: 42
device: cuda
data:
  data_dir: .local/data/experiments/sit-v1/dataset_mujoco
  cache_dir: .local/cache/generator
  image_size: [224, 224]
  trajectory_length: 150
  train_split: 0.9
  batch_size: 2
  num_workers: 2
  pin_memory: true
  normalize_motion: true
  cache_frames: false
  streaming_chunk_size: 0
  cold_start_augment: true
model:
  vlm_backbone: qwen3.5-2b
  vlm_frozen: true
  vlm_dtype: bfloat16
  vlm_vision_trainable: false
  vlm_lm_trainable: false
  vlm_gpu_preprocess: false
  cond_pos_embed: true
  max_cond_tokens: 96
  num_inference_steps: 15
  hidden_dim: 512
  num_decoder_layers: 8
  num_heads: 8
  dropout: 0.1
  trajectory_length: 150
  output_dim: 36
  inpaint_prev_chunk: true
  prev_chunk_frames: 15
training:
  num_epochs: 50
  accumulation_steps: 1
  learning_rate: 0.0001
  vlm_lr: 0.00001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  max_grad_norm: 1.0
  checkpoint_dir: .local/runs/generator/sit-v1
  checkpoint_every: 1
  eval_every: 5
